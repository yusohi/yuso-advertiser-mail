<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="유소 광고메일" />
    <meta name="robots" content="noindex, nofollow" />
    <title>광고주 메일 파이프라인</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen">
      <form class="login-card" id="loginForm">
        <p class="eyebrow">Private dashboard</p>
        <h1>Yuso Mail</h1>
        <p>비밀번호를 입력하면 이 기기에서 유소채널 광고 메일 대시보드를 열 수 있습니다.</p>
        <label>
          비밀번호
          <input id="passwordInput" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">열기</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </section>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="syncStatus">유소채널 메일함 · 불러오는 중</p>
          <h1>광고주 메일 파이프라인</h1>
        </div>
        <div class="summary" id="summary"></div>
      </header>

      <section class="controls" aria-label="필터">
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="광고주, 브랜드, 상태 검색" />
        </div>
        <div class="control-actions">
          <button class="refresh-button" id="refreshButton" type="button">새로고침</button>
          <button class="refresh-button" id="changePasswordButton" type="button">비밀번호 변경</button>
          <button class="refresh-button" id="logoutButton" type="button">로그아웃</button>
          <div class="segments" id="statusFilters" aria-label="상태 필터"></div>
        </div>
      </section>

      <section class="dashboard">
        <aside class="deal-list" aria-label="광고주 목록">
          <div class="list-header">
            <strong>대화 중인 광고주</strong>
            <span id="resultCount"></span>
          </div>
          <div id="dealList"></div>
        </aside>

        <section class="detail" id="detail" aria-label="광고주 상세"></section>
      </section>
    </main>

    <section class="modal-screen hidden" id="passwordModal" aria-hidden="true">
      <form class="login-card" id="changePasswordForm">
        <p class="eyebrow">Security</p>
        <h1>비밀번호 변경</h1>
        <label>
          현재 비밀번호
          <input id="currentPasswordInput" type="password" autocomplete="current-password" required />
        </label>
        <label>
          새 비밀번호
          <input id="newPasswordInput" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          새 비밀번호 확인
          <input id="confirmPasswordInput" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <div class="modal-actions">
          <button type="button" class="secondary-button" id="cancelPasswordChange">취소</button>
          <button type="submit">변경</button>
        </div>
        <p class="login-error" id="changePasswordError"></p>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
