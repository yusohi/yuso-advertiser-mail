<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="메일 도우미" />
    <meta name="robots" content="noindex, nofollow" />
    <title>메일 도우미</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260619-newsletter-archive-1" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen">
      <form class="login-card" id="loginForm">
        <p class="eyebrow">Private dashboard</p>
        <h1>Yuso Mail</h1>
        <p>비밀번호를 입력하면 이 기기에서 유소채널 광고 메일 대시보드를 열 수 있습니다.</p>
        <label>
          비밀번호
          <input id="passwordInput" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">열기</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </section>

    <main class="gmail-shell">
      <header class="appbar">
        <div class="brand-area">
          <button class="icon-button" id="layoutToggle" type="button" aria-label="목록 크기 조절">☰</button>
          <div class="brand-mark" aria-hidden="true">M</div>
          <h1>메일 도우미</h1>
        </div>

        <label class="search-wrap" aria-label="메일 검색">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="메일 검색" />
        </label>

        <div class="app-actions">
          <button class="icon-button" id="refreshButton" type="button" aria-label="새로고침">↻</button>
          <button class="profile-button" id="profileButton" type="button" aria-label="내 정보">
            <span>소정</span>
          </button>
          <section class="account-panel hidden" id="accountPanel" aria-label="내 정보 메뉴">
            <div class="account-head">
              <div class="profile-large">소정</div>
              <div>
                <strong>유소채널</strong>
                <p>yuso@wootso.com</p>
              </div>
            </div>
            <p class="gmail-status" id="gmailStatus">Gmail 연결 확인 중</p>
            <button id="connectGmailButton" type="button">Gmail 연결</button>
            <button id="syncGmailButton" type="button">Gmail 즉시 동기화</button>
            <button id="changePasswordButton" type="button">비밀번호 설정</button>
            <button id="logoutButton" type="button">로그아웃</button>
          </section>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="메일함">
          <nav class="mail-nav" aria-label="상태 필터">
            <div id="statusFilters"></div>
          </nav>
          <div class="sidebar-section">
            <div class="sidebar-title">
              <span>요약</span>
            </div>
            <div class="summary" id="summary"></div>
          </div>
        </aside>

        <section class="mail-surface">
          <div class="mail-toolbar">
            <div>
              <p class="eyebrow" id="syncStatus">유소채널 메일함 · 불러오는 중</p>
              <strong>광고주 대화</strong>
            </div>
            <span id="resultCount"></span>
          </div>

          <section class="dashboard">
            <aside class="deal-list" aria-label="광고주 목록">
              <div id="dealList"></div>
            </aside>

            <section class="detail" id="detail" aria-label="광고주 상세"></section>
          </section>
        </section>
      </div>
    </main>

    <section class="modal-screen hidden" id="passwordModal" aria-hidden="true">
      <form class="login-card" id="changePasswordForm">
        <p class="eyebrow">Security</p>
        <h1>비밀번호 변경</h1>
        <label>
          현재 비밀번호
          <input id="currentPasswordInput" type="password" autocomplete="current-password" required />
        </label>
        <label>
          새 비밀번호
          <input id="newPasswordInput" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          새 비밀번호 확인
          <input id="confirmPasswordInput" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <div class="modal-actions">
          <button type="button" class="secondary-button" id="cancelPasswordChange">취소</button>
          <button type="submit">변경</button>
        </div>
        <p class="login-error" id="changePasswordError"></p>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./safari-session.js?v=20260619-newsletter-archive-1"></script>
    <script src="./app.js?v=20260619-newsletter-archive-1"></script>
  </body>
</html>
